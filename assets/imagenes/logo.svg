<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="100%" height="100%">
  <defs>
    <!-- Gold gradient for the inner circle -->
    <radialGradient id="goldGrad" cx="65%" cy="30%" r="65%" fx="65%" fy="30%">
      <stop offset="0%" stop-color="#F2D06B" />
      <stop offset="50%" stop-color="#E5B23D" />
      <stop offset="100%" stop-color="#C68E20" />
    </radialGradient>
    
    <!-- Blue color for waves -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E6496" />
      <stop offset="100%" stop-color="#1175AD" />
    </linearGradient>
  </defs>

  <!-- Left: Monogram and Waves -->
  <g transform="translate(10, 5)">
    <!-- Gold Circle -->
    <circle cx="75" cy="45" r="34" fill="url(#goldGrad)" />
    
    <!-- Monogram SC (Serif Interlocking style) -->
    <text x="75" y="55" font-family="'Georgia', 'Times New Roman', serif" font-size="40" font-weight="bold" fill="#222" text-anchor="middle" letter-spacing="-2">S</text>
    <text x="82" y="57" font-family="'Georgia', 'Times New Roman', serif" font-size="34" font-weight="bold" fill="#222" text-anchor="middle" opacity="0.95">C</text>

    <!-- Blue Waves -->
    <!-- Wave 1: The outer wrap around circle and first wave -->
    <path d="M 68 5 C 31 10, 20 42, 28 72 C 34 94, 52 108, 75 110 C 135 115, 170 85, 230 85 C 290 85, 335 118, 360 120 C 330 115, 280 102, 230 102 C 170 102, 135 117, 75 117 C 47 117, 24 100, 16 72 C 9 40, 24 10, 68 5 Z" fill="url(#waveGrad)" />
    
    <!-- Wave 2: Middle wave -->
    <path d="M 45 88 C 80 115, 120 118, 170 118 C 220 118, 260 100, 310 100 C 345 100, 372 112, 385 115 C 360 108, 330 94, 300 94 C 250 94, 215 112, 170 112 C 120 112, 80 104, 45 88 Z" fill="url(#waveGrad)" />
    
    <!-- Wave 3: Bottom wave -->
    <path d="M 110 121 C 150 128, 190 128, 230 128 C 285 128, 315 112, 350 112 C 375 112, 395 120, 400 122 C 385 118, 360 106, 340 106 C 300 106, 275 122, 220 122 C 180 122, 140 118, 110 121 Z" fill="url(#waveGrad)" />
  </g>

  <!-- Right: Typography -->
  <!-- SERVICIOS INDUSTRIALES -->
  <text x="175" y="32" font-family="'Montserrat', 'Inter', 'Helvetica', sans-serif" font-size="16.5" font-weight="600" font-style="italic" fill="#FFFFFF" letter-spacing="1">SERVICIOS INDUSTRIALES</text>
  
  <!-- SAN CAYETANO -->
  <text x="172" y="70" font-family="'Georgia', 'Times New Roman', serif" font-size="44" font-weight="bold" fill="#FFFFFF" letter-spacing="0.5">SAN CAYETANO</text>
  
  <!-- -DE LANARO Y CIA. S.R.L- -->
  <text x="328" y="88" font-family="'Montserrat', 'Inter', 'Helvetica', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" letter-spacing="0.5">-DE LANARO Y CIA. S.R.L-</text>
</svg>
